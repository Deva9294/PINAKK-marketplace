services:
  - type: web
    name: pinakk-marketplace
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NEXT_PUBLIC_SITE_URL
        value: https://pinakk-marketplace.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: PINAKK_ADMIN_EMAIL
        sync: false
      - key: PINAKK_ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Optional: configure all four values to enable Razorpay checkout and webhooks.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
