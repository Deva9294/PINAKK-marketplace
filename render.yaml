services:
  - type: web
    name: pinakk-marketplace
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: MONGODB_URI
        sync: false
      - key: PINAKK_ADMIN_EMAIL
        sync: false
      - key: PINAKK_ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
