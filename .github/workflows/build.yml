name: PINAKK build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n+": "+v.severity+"; direct="+v.isDirect+"; range="+v.range+"; fix="+JSON.stringify(v.fixAvailable))'
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/pinakk_build_check
          PINAKK_ADMIN_EMAIL: admin@example.com
          PINAKK_ADMIN_PASSWORD: build-check-only-not-a-real-password
          AUTH_SECRET: build-check-only-secret-with-more-than-32-bytes
