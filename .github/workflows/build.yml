name: PINAKK build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/pinakk_build_check
          PINAKK_ADMIN_API_KEY: build-check-only-not-a-real-secret
